services:
  app:
    build: .
    container_name: solarsense-app
    ports:
      - "8501:8501"
    environment:
      - OLLAMA_URL=http://ollama:11434
      - LLM_MODEL=qwen2.5:7b
    volumes:
      - ./data:/app/data
      - ./Dataset:/app/Dataset:ro
    depends_on:
      - ollama
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: solarsense-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  ollama_models:
